<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASUH Orrery</title>
    <link href="./src/style.css" rel="stylesheet" />


  </head>
  
  <body>
    <header id="topbar">
      <span id="site-name">ASUH Orrery</span>

      <div id="search">
        <input id="search-input" type="search" placeholder="Search bodies"
               autocomplete="off" spellcheck="false" aria-label="Search bodies" />
        <ul id="search-results" hidden></ul>
      </div>

      <span class="field">
        <span class="key">Date</span>
        <time id="sim-clock"></time>
      </span>
      <a id="portfolio-link" href="https://example.com" target="_blank" rel="noopener">Portfolio</a>
    </header>

    <aside id="factsheet" hidden></aside>

    <div id="body-label" hidden>
      <span id="body-label-name"></span>
      <span id="body-label-sub"></span>
    </div>

    <div id="time-controls">
      <button id="play-pause" type="button">Pause</button>
      <input id="time-scale" type="range" step="1" aria-label="Time scale" />
      <span class="field">
        <span class="key">Rate</span>
        <span id="time-scale-label">1 sec = 1 day</span>
      </span>
      <button id="time-reset" type="button">live</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
